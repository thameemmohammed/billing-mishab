<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="50%" stop-color="#E2C992" />
      <stop offset="100%" stop-color="#A88438" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B76E79" />
      <stop offset="100%" stop-color="#8F4853" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4A2E35" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(10, 8)" filter="url(#shadow)">
    <!-- Outer Octagon/Ring -->
    <circle cx="32" cy="32" r="30" fill="#FAF5EF" stroke="url(#goldGrad)" stroke-width="1.8" />
    <circle cx="32" cy="32" r="26" fill="none" stroke="url(#roseGrad)" stroke-width="0.8" stroke-dasharray="2,2" />
    
    <!-- Botanical Petals -->
    <path d="M 32 10 C 35 18 39 24 46 26 C 39 28 35 34 32 42 C 29 34 25 28 18 26 C 25 24 29 18 32 10 Z" 
          fill="url(#goldGrad)" opacity="0.25" />
    <path d="M 23 20 C 26 23 29 27 28 34 C 23 31 19 28 23 20 Z" fill="url(#roseGrad)" opacity="0.35" />
    <path d="M 41 20 C 38 23 35 27 36 34 C 41 31 45 28 41 20 Z" fill="url(#roseGrad)" opacity="0.35" />

    <!-- Center Monogram 'M' -->
    <text x="32" y="39" 
          font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
          font-size="22" 
          font-weight="700" 
          font-style="italic" 
          fill="url(#roseGrad)" 
          text-anchor="middle">M</text>

    <!-- Small Sparkle Star -->
    <polygon points="32,7 33,10 36,11 33,12 32,15 31,12 28,11 31,10" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(85, 24)">
    <text x="0" y="20" 
          font-family="'Playfair Display', 'Cormorant Garamond', 'Didot', 'Georgia', serif" 
          font-size="25" 
          font-weight="700" 
          letter-spacing="4" 
          fill="#2C2325">MISHAB</text>
    
    <text x="2" y="38" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="8.5" 
          font-weight="600" 
          letter-spacing="5" 
          fill="#B76E79">LUXURY COSMETICS</text>

    <text x="2" y="49" 
          font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-size="6.5" 
          font-weight="400" 
          letter-spacing="2.5" 
          fill="#8A7B7D">HAUTE PARFUMERIE &amp; BEAUTÉ</text>
  </g>
</svg>
